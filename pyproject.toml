[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veinseg"
version = "0.2.0"
description = "Recurrent (ConvGRU) vein segmentation and vessel-centre inference for OCT sequences"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "albumentations>=2.0.8",
    "pillow>=10.0",
    "tqdm>=4.65",
    "PyYAML>=6.0",
]

[project.scripts]
veinseg = "veinseg.cli:main"

[tool.setuptools]
packages = ["veinseg"]
